<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>المجسم التفاعلي: الأشعة النووية</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3fb;--card:#fff;--tx:#2b2b3a;--mut:#6a6580;--pri:#2e1a57;--ln:#e3ddf0;--r:#d7263d;--b:#1f6fd1;--v:#7b3fbf;--y:#f5c518}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17102b;--card:#241a42;--tx:#ece8f7;--mut:#b3a9d0;--pri:#f5c518;--ln:#3a2d63;--r:#ff6b7f;--b:#5aa2ff;--v:#b78bff}}
:root[data-theme=dark]{--bg:#17102b;--card:#241a42;--tx:#ece8f7;--mut:#b3a9d0;--pri:#f5c518;--ln:#3a2d63;--r:#ff6b7f;--b:#5aa2ff;--v:#b78bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.w{max-width:980px;margin:0 auto;padding:18px}h1{color:var(--pri);font-size:26px;margin:6px 0 2px}p.s{margin:0 0 14px;color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.tabs button{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:99px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.pn{display:none;margin-top:14px}.pn.on{display:block}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.img{position:relative;direction:ltr}.img img{width:100%;display:block;border-radius:10px}
.hs{position:absolute;border:3px solid var(--y);border-radius:10px;background:rgba(245,197,24,.18);cursor:pointer;animation:p 1.8s infinite}
.hs.on{background:rgba(245,197,24,.45);animation:none}@keyframes p{50%{box-shadow:0 0 0 6px rgba(245,197,24,.35)}}
.info{margin-top:12px;min-height:90px}.info b{color:var(--pri);font-size:18px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:var(--card)}
.ct{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px}.ct label{display:flex;gap:6px;align-items:center}
.ct input[type=range]{width:180px}.chip{padding:3px 10px;border-radius:99px;color:#fff;font-size:14px}
.seg button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 12px;font:inherit;cursor:pointer}.seg button.on{background:var(--pri);color:var(--bg)}
.seg button:first-child{border-radius:0 8px 8px 0}.seg button:last-child{border-radius:8px 0 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.st{cursor:pointer;text-align:center}.st .c{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;color:#fff;font:700 26px Arial;display:grid;place-items:center}
.st .d{display:none;text-align:right;font-size:15px;margin-top:8px}.st.on .d{display:block}
.q{margin-bottom:14px}.q button{display:block;width:100%;text-align:right;margin-top:6px;padding:9px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.ok{background:#1f9d55!important;color:#fff!important}.no{background:#d7263d!important;color:#fff!important}
</style></head><body><div class="w">

const $=id=>document.getElementById(id);
const TABS=['المجسم','محاكاة المجال','ربط STEM'];
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;if(!i)b.className='on';b.onclick=()=>{document.querySelectorAll('.tabs button').forEach((x,j)=>x.classList.toggle('on',j==i));document.querySelectorAll('.pn').forEach((x,j)=>x.classList.toggle('on',j==i))};$('tabs').appendChild(b)});
// hotspots: [l,t,w,h %, title, text]
const H=[[1.5,40,22,34,'مصدر الإشعاع','صندوق يحتوي مادة مشعة تُطلق ثلاثة أنواع من الأشعة: ألفا وبيتا وجاما. الشكل مكعب في التصميم الهندسي.'],
[40,33,21,37,'المجال المغناطيسي','مغناطيسان (شمال N وجنوب S) يصنعان مجالًا يؤثر في الأشعة المشحونة فقط.'],
[77,29,9,47,'شاشة الاستقبال','لوح مستطيل تظهر عليه نقاط وصول الأشعة، فنرى مقدار انحراف كل شعاع.'],
[64,78,24,16,'أشعة ألفا (α)','جسيمات هي نوى هيليوم، موجبة الشحنة وثقيلة. في المجسم: تنحرف بشدة.'],
[39,78,22,16,'أشعة بيتا (β)','إلكترونات سالبة الشحنة وخفيفة. في المجسم: تنحرف قليلًا.'],
[11,78,24,16,'أشعة جاما (γ)','موجات كهرومغناطيسية متعادلة، لذلك لا تتأثر بالمجال المغناطيسي.']];
H.forEach((h,i)=>{const d=document.createElement('div');d.className='hs';d.style.cssText=`left:${h[0]}%;top:${h[1]}%;width:${h[2]}%;height:${h[3]}%`;d.onclick=()=>{document.querySelectorAll('.hs').forEach(x=>x.classList.remove('on'));d.classList.add('on');$('info').innerHTML=`<b>${h[4]}</b><br>${h[5]}`};$('hot').appendChild(d)});
// simulation
const cv=$('cv'),cx=cv.getContext('2d');let mode=0,t0=0;
const K=[[{k:1,c:'--r'},{k:.4,c:'--b'}],[{k:.35,c:'--r'},{k:-1,c:'--b'}]];
const X0=90,X1=250,X2=470,X3=640,Y0=200,col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function off(x,a){const d=Math.max(0,Math.min(x,X2)-X1);let y=.5*a*d*d;if(x>X2)y+=a*(X2-X1)*(x-X2);return y}
function ray(i){const B=+$('B').value,g=i==2,a=g?0:K[mode][i].k*B*.00022;return{a,g}}
function draw(ts){const c=n=>col(n);cx.clearRect(0,0,760,400);cx.fillStyle=c('--ln');
cx.fillStyle='#2b2b3a';cx.fillRect(10,140,80,120);cx.fillStyle='#f5c518';cx.beginPath();cx.arc(50,200,26,0,7);cx.fill();cx.fillStyle='#2b2b3a';cx.font='700 22px Arial';cx.textAlign='center';cx.fillText('☢',50,209);
[[40,'#1f6fd1','#d7263d'],[320,'#1f6fd1','#d7263d']].forEach(m=>{cx.fillStyle=m[1];cx.fillRect(X1,m[0]-20+ (m[0]>100?0:0),110,32);cx.fillStyle=m[2];cx.fillRect(X1+110,m[0]-20,110,32);cx.fillStyle='#fff';cx.font='700 18px Arial';cx.fillText('N',X1+55,m[0]+2);cx.fillText('S',X1+165,m[0]+2)});
cx.fillStyle='#f5c518';cx.fillRect(X3,60,14,280);cx.fillStyle='#fff';cx.fillRect(X3+14,60,10,280);
const on=[$('ca').checked,$('cb').checked,$('cg').checked],cl=[c('--r'),c('--b'),c('--v')];
for(let i=0;i<3;i++){if(!on[i])continue;const r=ray(i),dy=x=>(r.g?Math.sin(x/9+ts/180)*5:0)-off(x,r.a);
cx.strokeStyle=cl[i];cx.lineWidth=3;cx.beginPath();for(let x=X0;x<=X3;x+=4){const y=Y0+(i-1)*14+dy(x);x==X0?cx.moveTo(x,y):cx.lineTo(x,y)}cx.stroke();
const x=X0+((ts/6+i*90)%(X3-X0)),y=Y0+(i-1)*14+dy(x);cx.fillStyle=cl[i];cx.beginPath();cx.arc(x,y,7,0,7);cx.fill();
const ye=Y0+(i-1)*14+dy(X3);cx.beginPath();cx.arc(X3+12,ye,6,0,7);cx.fill();cx.fillStyle=c('--tx');cx.font='15px Tahoma';cx.textAlign='left';cx.fillText(['ألفا','بيتا','جاما'][i],X3+34,ye+5)}
requestAnimationFrame(draw)}
function note(){$('bv').textContent=$('B').value;$('sn').innerHTML=mode?'<b>حسب الفيزياء:</b> ألفا (موجبة) وبيتا (سالبة) تنحرفان في اتجاهين متعاكسين، وبيتا تنحرف أكثر لأنها أخف بكثير. جاما لا تنحرف.':'<b>حسب المجسم:</b> ألفا تنحرف بشدة وبيتا قليلًا وجاما لا تنحرف. جرّب تغيير شدة المجال B.'}
['B','ca','cb','cg'].forEach(i=>$(i).oninput=note);
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x==b));note()});
note();requestAnimationFrame(draw);

['M','الرياضيات','--pri','قوة لورنتز F = q·v·B ونصف قطر المسار r = m·v/(q·B). وكلما زادت B زاد الانحراف، وهذا ما تراه في المحاكاة.']].forEach(a=>{const d=document.createElement('div');d.className='card st';d.innerHTML=`<div class="c" style="background:var(${a[2]})">${a[0]}</div><b>${a[1]}</b><div class="d">${a[3]}</div>`;d.onclick=()=>d.classList.toggle('on');$('stem').appendChild(d)});
